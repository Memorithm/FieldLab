name: FieldLab FL-B1 Boolean observability qualification

on:
  pull_request:
    paths:
      - "prereg/FL-B1.md"
      - "crates/field-core/**"
      - "crates/field-boolean/**"
      - "crates/field-bench/**"
      - "Cargo.toml"
      - ".github/workflows/flb1.yml"
  push:
    branches: [main]
    paths:
      - "prereg/FL-B1.md"
      - "crates/field-core/**"
      - "crates/field-boolean/**"
      - "crates/field-bench/**"
      - "Cargo.toml"
      - ".github/workflows/flb1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    name: FL-B1.0 frozen Boolean observability qualification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install nightly-2026-07-02 --profile minimal --component rustfmt --component clippy
          rustup override set nightly-2026-07-02
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p field-bench --bin flb1 -- -D warnings
      - name: Qualification unit tests
        run: cargo test -p field-bench --bin flb1
      - name: Execute frozen campaign twice
        env:
          FIELDLAB_SOURCE_REVISION: ${{ github.sha }}
        run: |
          mkdir -p results/ci
          cargo run -p field-bench --bin flb1 > results/ci/flb1-run-a.json
          cargo run -p field-bench --bin flb1 > results/ci/flb1-run-b.json
          cmp results/ci/flb1-run-a.json results/ci/flb1-run-b.json
          cp results/ci/flb1-run-a.json results/ci/flb1.json
      - name: Validate protocol evidence without gating scientific outcomes
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("results/ci/flb1.json").read_text())
          assert report["schema"] == "fieldlab.flb1-report.v1"
          assert report["predicate_schema"] == "fieldlab.boolean-predicate.v1"
          assert report["source_revision"] == "${{ github.sha }}"
          assert report["clean_case_count"] == 3
          assert report["perturbation_case_count"] == 240
          assert len(report["predicates"]) == 16
          assert report["replay_exact"] is True
          assert report["construction_tolerance"] == 1.0e-12
          assert report["validity_norm_squared_tolerance"] == 1.0e-10
          assert report["max_norm_squared_error"] <= 1.0e-10
          assert [r["radius_index"] for r in report["radius_retention"]] == [0, 1, 2, 3, 4]
          assert [r["radius"] for r in report["radius_retention"]] == [0.01, 0.05, 0.10, 0.25, 0.50]
          print(json.dumps({
              "hypotheses": report["hypotheses"],
              "minimum_clean_hamming_distance": report["minimum_clean_hamming_distance"],
              "radius_retention": report["radius_retention"],
              "mutual_information_bits": report["mutual_information_bits"],
              "constant_baseline_mutual_information_bits": report["constant_baseline_mutual_information_bits"],
              "max_norm_squared_error": report["max_norm_squared_error"],
          }, indent=2))
          PY
      - name: Retain FL-B1.0 report even on failed execution gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fieldlab-flb1-${{ github.sha }}
          path: |
            results/ci/flb1.json
            results/ci/flb1-run-a.json
            results/ci/flb1-run-b.json
          if-no-files-found: warn
          retention-days: 30
      - name: Collect formatting diagnostics without changing the commit
        if: failure()
        run: |
          mkdir -p results/ci
          cargo fmt --all
          git diff -- crates/field-bench/src crates/field-bench/Cargo.toml .github/workflows/flb1.yml > results/ci/flb1-format.patch
      - name: Retain failed-build formatting diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fieldlab-flb1-format-${{ github.sha }}
          path: results/ci/flb1-format.patch
          if-no-files-found: warn
