name: FieldLab FL-4E External Focus Hysteresis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CCOS_COMMIT: a3c4d7e03744430c74dc337463ff3e944b4933ad

jobs:
  fl4e:
    name: FL-4E external native-window focus hysteresis
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout FieldLab
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout pinned CCOS-Core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          repository: Memorithm/CCOS-Core
          ref: a3c4d7e03744430c74dc337463ff3e944b4933ad
          path: external/CCOS-Core

      - name: Verify external provenance
        run: |
          test "$(git -C external/CCOS-Core rev-parse HEAD)" = "$CCOS_COMMIT"
          test "$(grep -c 'channel = \"1.89.0\"' external/CCOS-Core/rust-toolchain.toml)" -eq 1

      - name: Install toolchains
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup toolchain install nightly-2026-07-02 --profile minimal

      - name: Build pinned CCOS runtime
        working-directory: external/CCOS-Core
        run: cargo +1.89.0 build --release --features llm --bin ccos

      - name: Execute frozen native workload twice
        run: |
          mkdir -p results/ci
          python3 scripts/fl4e_ccos_focus_trace.py \
            external/CCOS-Core/src \
            --ccos external/CCOS-Core/target/release/ccos \
            --commit "$CCOS_COMMIT" \
            --budget 2048 \
            --depth 3 \
            --out results/ci/fl4e-trace-a.json
          python3 scripts/fl4e_ccos_focus_trace.py \
            external/CCOS-Core/src \
            --ccos external/CCOS-Core/target/release/ccos \
            --commit "$CCOS_COMMIT" \
            --budget 2048 \
            --depth 3 \
            --out results/ci/fl4e-trace-b.json

      - name: Calibrate and evaluate holdout
        run: |
          cargo +nightly-2026-07-02 run -p field-bench --bin fl4e -- \
            results/ci/fl4e-trace-a.json \
            results/ci/fl4e-trace-b.json \
            "$CCOS_COMMIT" \
            > results/ci/fl4e.json
          cat results/ci/fl4e.json

      - name: Retain FL-4E evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fieldlab-fl4e-${{ github.sha }}
          path: |
            results/ci/fl4e-trace-a.json
            results/ci/fl4e-trace-b.json
            results/ci/fl4e.json
          if-no-files-found: error
