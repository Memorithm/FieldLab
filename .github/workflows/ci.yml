name: FieldLab CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fl0:
    name: FL-0 validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install nightly-2026-07-02 --profile minimal --component rustfmt --component clippy
          rustup override set nightly-2026-07-02

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Execute FL-0
        run: |
          mkdir -p results/ci
          cargo run -p field-bench > results/ci/fl0.json
          cat results/ci/fl0.json

      - name: Retain FL-0 evidence
        uses: actions/upload-artifact@v4
        with:
          name: fieldlab-fl0-${{ github.sha }}
          path: results/ci/fl0.json
          if-no-files-found: error
