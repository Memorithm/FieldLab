  fl5e:
    name: FL-5E ambiguity-gated strong perturbation
    needs: fl0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install nightly-2026-07-02 --profile minimal
          rustup override set nightly-2026-07-02
      - name: Execute FL-5E campaign
        run: |
          mkdir -p results/ci
          FIELDLAB_SOURCE_SHA="${{ github.event.pull_request.head.sha || github.sha }}" cargo run -p field-bench --bin fl5e > results/ci/fl5e.json
