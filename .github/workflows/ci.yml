      - name: Execute FL-3 campaign
        run: |
          mkdir -p results/ci
          cargo run -p field-bench --bin fl3 > results/ci/fl3.json
          cat results/ci/fl3.json
      - name: Retain FL-3 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fieldlab-fl3-${{ github.event.pull_request.head.sha || github.sha }}
          path: results/ci/fl3.json
          if-no-files-found: error

  fl4:
    name: FL-4A CCOS semantic field mapping
    needs: fl3
    runs-on: ubuntu-latest
