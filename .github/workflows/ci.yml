name: FieldLab CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fl0:
    name: FL-0 foundation validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install nightly-2026-07-02 --profile minimal --component rustfmt --component clippy
          rustup override set nightly-2026-07-02
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Execute FL-0
        run: |
          mkdir -p results/ci
          cargo run -p field-bench --bin field-bench > results/ci/fl0.json
          cat results/ci/fl0.json
      - name: Retain FL-0 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fieldlab-fl0-${{ github.event.pull_request.head.sha || github.sha }}
          path: results/ci/fl0.json
          if-no-files-found: error

  fl1:
    name: FL-1 associative recall
    needs: fl0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install nightly-2026-07-02 --profile minimal
          rustup override set nightly-2026-07-02
      - name: Execute FL-1 exhaustive campaign
        run: |
          mkdir -p results/ci
          cargo run -p field-bench --bin fl1 > results/ci/fl1.json
          cat results/ci/fl1.json
      - name: Retain FL-1 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fieldlab-fl1-${{ github.event.pull_request.head.sha || github.sha }}
          path: results/ci/fl1.json
          if-no-files-found: error

  fl2:
    name: FL-2 signed competition and frustration
    needs: fl1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install nightly-2026-07-02 --profile minimal
          rustup override set nightly-2026-07-02
      - name: Execute FL-2 campaign
        run: |
          mkdir -p results/ci
          cargo run -p field-bench --bin fl2 > results/ci/fl2.json
          cat results/ci/fl2.json
      - name: Retain FL-2 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fieldlab-fl2-${{ github.event.pull_request.head.sha || github.sha }}
          path: results/ci/fl2.json
          if-no-files-found: error

  fl3:
    name: FL-3 hysteresis and context switching
    needs: fl2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install nightly-2026-07-02 --profile minimal
