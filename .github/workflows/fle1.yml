name: FieldLab FL-E1 Validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fle1:
    name: FL-E1 conservative model extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install nightly-2026-07-02 --profile minimal
          rustup override set nightly-2026-07-02

      - name: Execute FL-E1 validation campaign
        run: |
          mkdir -p results/ci
          cargo run -p field-bench --bin fle1 > results/ci/fle1.json
          cat results/ci/fle1.json

      - name: Retain FL-E1 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fieldlab-fle1-${{ github.sha }}
          path: results/ci/fle1.json
          if-no-files-found: error
