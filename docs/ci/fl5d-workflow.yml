name: FieldLab FL-5D Validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fl5d:
    name: FL-5D shallow-boundary clean-cue-constrained escape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install nightly-2026-07-02 --profile minimal --component rustfmt --component clippy
          rustup override set nightly-2026-07-02

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Execute FL-5D campaign
        run: |
          mkdir -p results/ci
          cargo run -p field-bench --bin fl5d > results/ci/fl5d.json
          cat results/ci/fl5d.json

      - name: Retain FL-5D evidence
        uses: actions/upload-artifact@v4
        with:
          name: fieldlab-fl5d-${{ github.sha }}
          path: results/ci/fl5d.json
          if-no-files-found: error
