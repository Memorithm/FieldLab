name: FieldLab FL-5C Validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fl5c:
    name: FL-5C nonempty-holdout-clean-cue basin escape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install nightly-2026-07-02 --profile minimal --component rustfmt --component clippy
          rustup override set nightly-2026-07-02

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Execute FL-5C campaign
        run: |
          mkdir -p results/ci
          cargo run -p field-bench --bin fl5c > results/ci/fl5c.json
          cat results/ci/fl5c.json

      - name: Retain FL-5C evidence
        uses: actions/upload-artifact@v4
        with:
          name: fieldlab-fl5c-${{ github.sha }}
          path: results/ci/fl5c.json
          if-no-files-found: error
